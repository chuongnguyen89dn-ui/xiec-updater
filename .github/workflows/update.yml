name: Update Xiec movies and categories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch-two-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enrich SNOS-357 and MIKR-084
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: chuongnguyen89dn-ui/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
        run: node patch-two-latest-metadata.js

  update-new-movies:
    needs: patch-two-latest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply current metadata selectors
        run: node patch-fast-meta.js
      - name: Scan newest pages and update addon data
        env:
          SOURCE_URL: https://vlxx.phd/
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: chuongnguyen89dn-ui/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          START_PAGE: 1
          MAX_PAGE: 3
          STOP_EMPTY: 2
          FAST_CONCURRENCY: 6
          ENRICH_RECENT: 30
        run: node fast-full-scan.js

  category-map:
    needs: update-new-movies
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout updater
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Crawl every page of each approved category and write map
        env:
          SOURCE_URL: https://vlxx.phd/
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: chuongnguyen89dn-ui/xiec
          CATEGORY_PATH: data/site-categories.json
        run: node build-category-map.js
