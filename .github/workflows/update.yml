name: Update Xiec movies and categories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: xiec-updater-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe-demo-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Probe JavSubtitled first, JapanSM only if needed
        run: node probe-demo-images.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-image-probe
          path: |
            demo-image-probe.json
            probe-*-primary.html
            probe-*-fallback.html
          if-no-files-found: ignore

  update-new-movies:
    needs: probe-demo-images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node patch-fast-meta.js
      - name: Scan newest pages
        env:
          SOURCE_URL: https://vlxx.phd/
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: chuongnguyen89dn-ui/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
          START_PAGE: 1
          MAX_PAGE: 3
          STOP_EMPTY: 2
          FAST_CONCURRENCY: 6
          ENRICH_RECENT: 30
        run: node fast-full-scan.js

  patch-two-latest:
    needs: update-new-movies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Apply verified enrichment last
        env:
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: chuongnguyen89dn-ui/xiec
          TARGET_PATH: data/ket_qua_1500_phim.json
        run: node patch-two-latest-metadata.js

  category-map:
    needs: patch-two-latest
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Crawl categories
        env:
          SOURCE_URL: https://vlxx.phd/
          XIEC_TOKEN: ${{ secrets.XIEC_TOKEN }}
          TARGET_REPO: chuongnguyen89dn-ui/xiec
          CATEGORY_PATH: data/site-categories.json
        run: node build-category-map.js
